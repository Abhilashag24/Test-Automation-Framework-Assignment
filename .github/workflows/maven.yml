name: Test Automation Framework Assignment Workflow
on:
  schedule:
    - cron: '15 22 * * *'
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    
    - uses: actions/checkout@v6.1.0
    
    - name: Set up JDK 21
      uses: actions/setup-java@v5.6.0
      with:
         java-version: '21'
         distribution: 'temurin'
         cache: maven
        
    - name: Running Test Automation framework with Maven
      run: mvn test -X -Dbrowser='chrome' -DisLambdaTest=true -DisHeadless=false
      
      
    - name: Upload Test Logs
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:  
          name : Test logs
          path : logs/
          
    - name: Upload Screenshots as artifacts
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:  
          name : screenshots
          path : screenshots/

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:  
          name : html-report
          path : report.html     
          
    - name: Test Execution Status
      run: echo "Test execution completed"
 
    - name: Copy Report to gh-pages folder
      if: always()
      run: |
       mkdir -p public/extent-reports
       cp -R report.html public/extent-reports/
       cp -R screenshots/ public/extent-reports/screenshots/
       ls -l
      
      
    - name: Deploy
      if: always()      
      uses: JamesIves/github-pages-deploy-action@v4.8.0
      with:
          folder: public/extent-reports/
          token: ${{ secrets.PAT123 }}
          clean: true
